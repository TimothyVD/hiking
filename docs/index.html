<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sendas Tradicionales de Calp</title>
  <link rel="stylesheet" href="leaflet.css"/>
  <script data-goatcounter="https://sendas-calp.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f0eb;
    }

    #layout {
      display: flex;
      height: 100vh;
      height: 100dvh;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      background: #fff;
      box-shadow: 2px 0 12px rgba(0,0,0,.12);
      z-index: 1000;
      overflow: hidden;
    }

    #sidebar-header {
      padding: 18px 20px 14px;
      background: linear-gradient(135deg, #2d6a2d 0%, #1a4a1a 100%);
      color: #fff;
      flex-shrink: 0;
    }

    #sidebar-header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .3px;
      line-height: 1.3;
    }

    #sidebar-header p {
      font-size: 12px;
      opacity: .8;
      margin-top: 3px;
    }

    #route-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 8px;
    }

    /* ── Section labels ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #888;
      margin: 10px 4px 6px;
    }

    /* ── Route cards ── */
    .route-card {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s;
      border: 2px solid transparent;
      margin-bottom: 4px;
    }

    .route-card:hover { background: #f5f5f5; }
    .route-card.active {
      background: #f0f7f0;
      border-color: #2d6a2d;
    }

    .route-swatch {
      width: 6px;
      flex-shrink: 0;
      align-self: stretch;
      border-radius: 3px;
      min-height: 36px;
    }

    .route-info { flex: 1; min-width: 0; }

    .route-id {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #666;
    }

    .route-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      white-space: nowrap;
      overflow: hidden;
      /* clipping only when collapsed; active removes this */
      text-overflow: ellipsis;
    }

    .route-meta {
      font-size: 11px;
      color: #777;
      margin-top: 1px;
    }

    .route-desc {
      display: none;
      font-size: 11.5px;
      color: #4a4a4a;
      line-height: 1.55;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid #e0ede0;
    }

    .route-card.active .route-desc { display: block; }

    .btn-download {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 9px;
      background: #f0f0f0;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s, color .15s;
      white-space: nowrap;
    }

    .btn-download:hover {
      background: #2d6a2d;
      color: #fff;
    }

    /* ── Grand Tour card ── */
    .grand-tour-card {
      background: #1a1a1a;
      color: #fff;
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background .15s;
      border: 2px solid transparent;
      margin-bottom: 4px;
    }

    .grand-tour-card:hover { background: #2a2a2a; }
    .grand-tour-card.active { border-color: #f5a623; }

    .grand-tour-card .gt-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    .grand-tour-card .gt-meta {
      font-size: 11px;
      color: #aaa;
      margin-top: 3px;
    }

    .grand-tour-card .gt-desc {
      font-size: 11px;
      color: #888;
      margin-top: 6px;
      font-style: italic;
    }

    .gt-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
    }

    .btn-download-dark {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      background: #333;
      border: none;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      color: #eee;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
      white-space: nowrap;
    }

    .btn-download-dark:hover { background: #f5a623; color: #1a1a1a; }

    /* ── Footer ── */
    #sidebar-footer {
      padding: 10px 12px 12px;
      border-top: 1px solid #eee;
      flex-shrink: 0;
    }

    .btn-download-all {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      color: #333;
      cursor: pointer;
      text-decoration: none;
      transition: background .15s;
    }

    .btn-download-all:hover { background: #e8e8e8; }

    .attribution {
      font-size: 10px;
      color: #aaa;
      text-align: center;
      margin-top: 8px;
    }

    .attribution a { color: #aaa; }

    /* ── Map ── */
    #map {
      flex: 1;
      min-width: 0;
    }

    /* ── Mobile ── */
    @media (max-width: 700px) {
      #layout { flex-direction: column-reverse; }

      #sidebar {
        width: 100%;
        height: 42vh;
        box-shadow: 0 -2px 12px rgba(0,0,0,.12);
      }

      #map { flex: 1; }
    }

    /* ── Popup ── */
    .route-popup .leaflet-popup-content-wrapper {
      border-radius: 10px;
      padding: 2px;
    }

    .popup-inner {
      padding: 4px 6px;
    }

    .popup-inner strong { font-size: 13px; }
    .popup-inner span { font-size: 12px; color: #666; display: block; margin-top: 2px; }
  </style>
</head>

// ── Map init ──
const map = L.map('map', { zoomControl: true });

L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  attribution: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="http://viewfinderpanoramas.org">SRTM</a> | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)',
}).addTo(map);

// ── Layer registry ──
const layers = {};  // id -> colored L.GeoJSON
const casings = {}; // id -> white outline L.GeoJSON
let activeId = null;

function svgIcon(color) {
  return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
}

function setActive(id) {
  if (activeId && layers[activeId]) {
    layers[activeId].setStyle({ weight: 5, opacity: 1 });
    if (casings[activeId]) casings[activeId].setStyle({ weight: 9, opacity: 0.8 });
    document.querySelectorAll('.route-card, .grand-tour-card').forEach(el => el.classList.remove('active'));
  }

  activeId = id;

  if (id && layers[id]) {
    if (casings[id]) { casings[id].setStyle({ weight: 12, opacity: 0.9 }); casings[id].bringToFront(); }
    layers[id].setStyle({ weight: 8, opacity: 1 });
    layers[id].bringToFront();

    try { map.fitBounds(layers[id].getBounds().pad(0.15)); } catch(e) {}

    const card = document.querySelector(`[data-id="${id}"]`);
    if (card) card.classList.add('active');
  }
}

// ── Sendas layers ──
SENDAS_GEOJSON.features.forEach(feature => {
  const props = feature.properties;
  const id = props.id;
  const route = ROUTES.find(r => r.id === id);
  if (!route) return;

  // White casing drawn first (underneath)
  const casing = L.geoJSON(feature, {
    style: { color: '#ffffff', weight: 9, opacity: 0.8, lineJoin: 'round', lineCap: 'round' }
  }).addTo(map);
  casings[id] = casing;

  const layer = L.geoJSON(feature, {
    style: { color: route.color, weight: 5, opacity: 1, lineJoin: 'round', lineCap: 'round' }
  });

  layer.bindPopup(() => {
    const snippet = route.desc.length > 110 ? route.desc.slice(0, 108) + '…' : route.desc;
    return `<div class="popup-inner"><strong>${route.name}</strong><span>${route.subtitle} · ${route.km} km</span><span style="margin-top:5px;color:#444">${snippet}</span></div>`;
  }, { className: 'route-popup' });

  layer.on('click', () => {
    setActive(id);
    layer.openPopup();
  });

  layer.addTo(map);
  layers[id] = layer;
});

// ── Grand Tour layer ──
const tourFeature = TOUR_GEOJSON.features[0];

const tourCasing = L.geoJSON(tourFeature, {
  style: { color: '#ffffff', weight: 9, opacity: 0.8, lineJoin: 'round', lineCap: 'round' }
}).addTo(map);
tourCasing.bringToBack();
casings['GRAND-TOUR'] = tourCasing;

const tourLayer = L.geoJSON(tourFeature, {
  style: { color: '#1a1a1a', weight: 4.5, opacity: 0.9, dashArray: '9 6', lineJoin: 'round', lineCap: 'round' }
});

tourLayer.bindPopup(() => {
  const p = tourFeature.properties;
  return `<div class="popup-inner"><strong>${p.name}</strong><span>${p.length_km} km · circular</span></div>`;
}, { className: 'route-popup' });

tourLayer.on('click', () => {
  setActive('GRAND-TOUR');
  tourLayer.openPopup();
});

tourLayer.addTo(map);
tourLayer.bringToBack();
layers['GRAND-TOUR'] = tourLayer;

// ── Fit all routes ──
const allBounds = L.featureGroup(Object.values(layers)).getBounds();
map.fitBounds(allBounds.pad(0.05));

// ── Build sidebar route cards ──
const routeList = document.getElementById('route-list');

ROUTES.forEach(route => {
  const card = document.createElement('div');
  card.className = 'route-card';
  card.setAttribute('data-id', route.id);

  card.innerHTML = `
    <div class="route-swatch" style="background:${route.color}"></div>
    <div class="route-info">
      <div class="route-id">${route.id}</div>
      <div class="route-name">${route.name}</div>
      <div class="route-meta">${route.subtitle} · ${route.km} km</div>
      <div class="route-desc">${route.desc}</div>
    </div>
    <a class="btn-download" href="gpx/${route.file}" download title="Download GPX"
       data-goatcounter-click="download-${route.id.toLowerCase()}" data-goatcounter-title="Download ${route.id} – ${route.name}">
      ${svgIcon('currentColor')}GPX
    </a>`;

  card.addEventListener('click', e => {
    if (e.target.closest('.btn-download')) return;
    setActive(route.id);
  });

  routeList.appendChild(card);
});

      ${svgIcon('#eee')}Download GPX
    </a>
  </div>`;

gtCard.addEventListener('click', e => {
  if (e.target.closest('.btn-download-dark')) return;
  setActive('GRAND-TOUR');
});

document.getElementById('grand-tour-card').appendChild(gtCard);
</script>
</body>
